name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Assistant Runtime composes sibling cores and host tools through relative
# file: dependencies, so CI reproduces the local directory layout before
# installing.
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: assistant-runtime
      - uses: actions/checkout@v7
        with:
          repository: Brightwav3/Jarvis-brain-core
          path: core-runtime
      - uses: actions/checkout@v7
        with:
          repository: Brightwav3/activation-core
          path: activation-core
      - uses: actions/checkout@v7
        with:
          repository: Brightwav3/Jarvis-speech-system
          path: speech-system
      - uses: actions/checkout@v7
        with:
          repository: Brightwav3/intelligence-core
          path: intelligence-core
      - uses: actions/checkout@v7
        with:
          repository: Brightwav3/memory-core
          path: memory-core
      - uses: actions/checkout@v7
        with:
          repository: Brightwav3/aec-system
          path: aec-system
      - uses: actions/checkout@v7
        with:
          repository: Brightwav3/state-core
          path: state-core
      - uses: actions/checkout@v7
        with:
          repository: Brightwav3/tool-system
          ref: main
          path: tool-system
      - uses: actions/checkout@v7
        with:
          repository: Brightwav3/host-tools
          ref: main
          path: host-tools
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      # Every core publishes its public entry from dist/, so a fresh checkout
      # must be built before Assistant Runtime can resolve it.
      - name: Build every core
        shell: bash
        run: |
          set -e
          for dir in tool-system core-runtime activation-core intelligence-core memory-core aec-system state-core "speech-system/realtime core" "speech-system/scribe core" "speech-system/voice core" host-tools; do
            echo "::group::$dir"
            (cd "$dir" && npm install --no-audit --no-fund && npm run build)
            echo "::endgroup::"
          done
      - name: Install dependencies
        working-directory: assistant-runtime
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Verify
        working-directory: assistant-runtime
        run: npm run verify
